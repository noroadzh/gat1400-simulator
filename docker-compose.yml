# ==============================================================================
# docker-compose: gat1400-simulator full stack
#
# Services
#   backend   — Go BFF API + WebSocket  (port 14080)
#   frontend  — nginx serving Vue SPA   (port 8080 → 80)
#   frontend depends on backend to ensure API is available before SPA loads.
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: gat1400/backend:${IMAGE_TAG:-latest}
    container_name: gat1400-backend
    restart: unless-stopped
    ports:
      - "14080:14080"
    environment:
      # Backend reads config.yaml relative to the working directory.
      - GAT1400_CONFIG_PATH=/data/config.yaml
      - GAT1400_LOG_LEVEL=info
    volumes:
      - ./data:/data:rw
    healthcheck:
      # distroless has no wget/curl; check by making an HTTP call via /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/14080 && echo -e 'GET /api/control/system/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - gat1400-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: gat1400/frontend:${IMAGE_TAG:-latest}
    container_name: gat1400-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gat1400-net
    # No shared volume needed; SPA is fully self-contained in nginx.

networks:
  gat1400-net:
    name: gat1400-net
    driver: bridge
