name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Upload SPA build output
        uses: actions/upload-artifact@v4.4.3
        with:
          name: spa-dist
          path: web/dist/
          retention-days: 7

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version: '1.25'
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version: '1.25'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6.5.1
        with:
          # golangci-lint 预编译二进制的构建 Go 版本必须 >= go.mod 声明版本
          # （go 1.25.5），否则在加载 module 时直接报
          # "can't load config: ... lower than the targeted Go version" 并退出码 3。
          # 升级 go.mod 时需同步升级本字段（详见 specs/ci-quality-gates）。
          version: v2.7.2

  build:
    name: Build
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version: '1.25'
          cache: true
      - run: make build
      - run: ./bin/gat1400-sim --version || true