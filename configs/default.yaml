# Gat 1400 simulator - default configuration.
#
# Copy to configs/local.yaml and adjust as needed; the simulator will pick
# the local file first, then fall back to defaults.

node:
  # Site code (first 8 digits of GAT 1400 / GB/T 28181 DeviceID).
  siteCode: 4100000000
  # Industry code: 130 = social public security / video image.
  industryCode: 130

protocol:
  listen: ":14000"

control:
  listen: ":14080"

storage:
  path: "./data/gat1400.db"

auth:
  realm: "com.gat1400.simulator"
  username: "admin"
  password: "admin"
  qop: "auth"

log:
  # log.level: debug | info | warn | error（空 = 用 --profile 默认值）
  level: ""
  # log.format: json | text
  format: "json"
  # log.stdout: 是否同步输出到 stdout
  stdout: true
  # log.file: 本地日志文件路径（留空 = 仅 stdout）
  file: ""
  # log.rotation: size | daily（仅 file 非空时生效）
  rotation: "size"
  # log.maxSizeMB: 单文件最大 MiB（仅 rotation=size）
  maxSizeMB: 100
  # log.maxBackups: 保留历史文件份数（0 = 全部保留）
  maxBackups: 7
  # log.maxAgeDays: 历史文件最大保留天数（仅 rotation=daily 时也用于清理）
  maxAgeDays: 30
  # log.compress: 历史文件是否 gzip 压缩
  compress: true

# keepaliveInterval controls the /VIID/System/Keepalive ping interval per device node.
# 0 or omitted = disabled. Examples: "30s", "60s", "90s".
keepaliveInterval: "30s"

scenarios:
  dir: "./configs/scenarios"
  autoStart: []