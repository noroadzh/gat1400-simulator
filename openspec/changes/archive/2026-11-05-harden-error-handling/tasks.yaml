# hardening 错误处理 — 变更任务清单

## 1. Cascade：3 处 `_ = c.Bind` 改为显式 400

**文件**：`internal/adapter/httpapi/cascade.go`

**现状**（已核实，全仓仅这 3 处 `_ = c.Bind`）：
- `:238` `handleSubscribeBulkDelete`（`DELETE /VIID/Subscribes`）
- `:363` `handleDispositionBulk`（`PUT /VIID/Dispositions`）
- `:378` `handleDispositionBulkDelete`（`DELETE /VIID/Dispositions`）

同文件其余 7 处 Bind（`:170, :198, :221, :264, :314, :341, :402`）**已正确**返回 400，参照其写法（`response.Error("", response.CodeInvalid, "invalid body")`）。

**改动**：3 处统一替换为
```go
if err := c.Bind(&body); err != nil {
    return c.JSON(http.StatusBadRequest, response.Error("", response.CodeInvalid, "invalid body"))
}
```

**验收**：
- `grep -rn '_ = c\.Bind' --include='*.go' .` 返回空。
- `go test ./internal/adapter/httpapi/...` 通过。
- 新增单测 3 个：畸形 Body → 400 且 repo 未被修改；合法 `{}` → 200；无 Body 的 DELETE → 200。

## 2. System：UnRegister / Keepalive 失败走日志

**文件**：`internal/adapter/httpapi/system.go`

`Server` 结构体**已有** `log *slog.Logger` 字段（`server.go:31`），无需改 constructor。

**改动**：
- `:127` UnRegister ——
  ```go
  if err := s.nodeSvc.RemoveNode(c.Request().Context(), body.UnRegisterObject.DeviceID); err != nil {
      s.log.Warn("node unregister failed", "event", "node_unregister_failed", "node_id", body.UnRegisterObject.DeviceID, "error", err)
  }
  ```
- `:141` Keepalive ——
  ```go
  if err := s.nodeSvc.MarkSeen(c.Request().Context(), id); err != nil {
      s.log.Warn("node keepalive failed", "event", "node_markseen_failed", "node_id", id, "error", err)
  }
  ```
响应逻辑不变（仍 200）。

**验收**：`go test ./internal/adapter/httpapi/...` 通过；新增用例注入失败的 NodeService 端口，断言响应 200 且日志含对应 event。

